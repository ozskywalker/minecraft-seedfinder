# CI — lint, vet, and test the Rust workspace and the web UI. Runs on Ubuntu (fast);
# the Windows release build is covered by the release workflow on v* tags.
#
# Trigger strategy (right-sized):
#   * pull_request  — ALWAYS runs the full matrix (no path filter). This is the
#     branch-protection gate, so required checks can never be skipped.
#   * push          — runs the full matrix for any change that can affect the build
#     (crates/, ui/, Cargo.*, deny.toml, scripts/, build.ps1, versions/, fixtures/,
#     .github/), but SKIPS it for provably inert docs-only changes (see paths-ignore).
#     Note: versions/*.json and fixtures/* are compile-time embedded / feed the 100%
#     accuracy gate, so they deliberately run the full suite (not a lighter tier).
#   * concurrency   — cancels superseded runs on the same ref (fast direct pushes).
#
# Future PR caveat: if a paths-ignore is ever added to `pull_request` too, the filtered
# jobs must NOT be marked as required status checks (GitHub treats a skipped required
# check as unsatisfied and blocks the merge). Keep pull_request unfiltered.
name: CI

on:
  push:
    # Provably inert docs-only changes — skipping these is safe and cuts wasted runs.
    # Do NOT add .github/**, scripts/**, build.ps1, Cargo.*, deny.toml, crates/,
    # ui/, versions/, or fixtures/ here: a change to CI config or the build path must
    # self-validate, and the version/fixture data is embedded and gate-checked.
    paths-ignore:
      - README.md
      - LICENSE
      - AGENTS.md
      - CLAUDE.md
      - PLAN.md
      - .gitattributes
      - .gitignore
      - .opencode/**
      - docs/**
  pull_request:

# Cancel superseded runs on the same ref (per-workflow scope so tag pushes to the
# release workflow don't cancel each other).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable) with rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # SIMD-batch regression guard (PLAN §6 / #4): the correctness half (batched ==
      # scalar result set) already runs in `cargo test`; this runs the release-mode
      # sweep bench with a generous speedup floor so the batched path can't silently
      # regress to scalar (≈1.0x) without failing CI.
      - name: SIMD-batch perf guard (release)
        run: cargo run -p be-search --release --example bench_sweep -- --check

      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    name: UI (test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Unit tests
        run: npm test
        working-directory: ui

      - name: Typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui
